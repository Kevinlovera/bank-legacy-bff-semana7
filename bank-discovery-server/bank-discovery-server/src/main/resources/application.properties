# ============================================================
# BANK DISCOVERY SERVER - EUREKA
# Servidor central de Service Discovery
# ============================================================

spring.application.name=bank-discovery-server

# Puerto oficial del servidor Eureka
server.port=8761

# Un servidor Eureka no debe registrarse como cliente
eureka.client.register-with-eureka=false

# El servidor Eureka no necesita consultar otro registro Eureka
eureka.client.fetch-registry=false

# Nombre visible del servidor en el registro
eureka.instance.hostname=localhost

# Información básica para monitoreo
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always