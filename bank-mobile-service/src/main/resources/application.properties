spring.application.name=bank-mobile-service
spring.config.import=optional:configserver:http://localhost:8888

server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/bank_xyz?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234567
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.cuentas.sliding-window-size=5
resilience4j.circuitbreaker.instances.cuentas.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cuentas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentas.wait-duration-in-open-state=10s
