# ============================================================
# BANCO XYZ - WEB SERVICE
# ============================================================

server.port=8081

spring.application.name=bank-web-service

# ============================================================
# MYSQL
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/bank_bff_s5
spring.datasource.username=root
spring.datasource.password=1234567
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# EUREKA
# ============================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================================
# RESILIENCE4J
# ============================================================

resilience4j.circuitbreaker.instances.cuentaService.sliding-window-size=5
resilience4j.circuitbreaker.instances.cuentaService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentaService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.cuentaService.permitted-number-of-calls-in-half-open-state=2

# ============================================================
# KAFKA
# ============================================================

spring.kafka.bootstrap-servers=localhost:9092